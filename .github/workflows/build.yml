name: YouTube patch (ads + background + download)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Tools download
        run: |
          gh release download -R ReVanced/revanced-cli -p "*all.jar" -O cli.jar --clobber
          gh release download -R ReVanced/revanced-patches -p "*.rvp" -O patches.rvp --clobber
          gh release download -R ReVanced/GmsCore -p "*.apk" -O microg.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: YouTube 21.44.528 download
        run: |
          curl -L -o youtube.apk "https://github.com/ayushzq/WhatsApp-web-2-in-one/releases/download/v1.0.4/com.google.android.youtube_21.44.528-1561310186_minAPI29.arm64-v8a.armeabi-v7a.x86.x86_64.nodpi._apkmirror.com.apk"
          ls -lh youtube.apk

      - name: Patch list (exact naam dekhne ke liye)
        run: java -jar cli.jar list-patches --with-packages --with-versions patches.rvp > all-patches.txt

      - name: Patch
        run: |
          java -jar cli.jar patch -p patches.rvp --force --exclusive \
            -e "Hide ads" \
            -e "Video ads" \
            -e "Background playback" \
            -e "Downloads" \
            -o youtube-patched.apk youtube.apk

      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: |
            youtube-patched.apk
            microg.apk
            all-patches.txt

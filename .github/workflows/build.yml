name: YouTube patch (ads + background + download)
on: workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Tools download (ReVanced repo blocked hai, isliye Morphe)
        run: |
          gh release download -R MorpheApp/morphe-desktop -p "morphe-desktop-*-all.jar" -O morphe.jar --clobber
          gh release download -R MorpheApp/morphe-patches -p "*.mpp" -O patches.mpp --clobber
          MICROG=$(gh release view -R MorpheApp/MicroG-RE --json assets -q '.assets[].name' | grep -E '^microg-[0-9.]+\.apk$' | head -1)
          gh release download -R MorpheApp/MicroG-RE -p "$MICROG" -O microg.apk --clobber
          ls -lh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: YouTube 21.44.528 download
        run: |
          curl -L -o youtube.apk "https://github.com/ayushzq/WhatsApp-web-2-in-one/releases/download/v1.0.4/com.google.android.youtube_21.44.528-1561310186_minAPI29.arm64-v8a.armeabi-v7a.x86.x86_64.nodpi._apkmirror.com.apk"
          ls -lh youtube.apk

      - name: Patch list (YouTube ke andar kya kya hai)
        run: java -jar morphe.jar list-patches --patches=patches.mpp -f com.google.android.youtube -p -d -u=false --out=all-patches.txt

      - name: Patch (sirf 4 chahiye)
        run: |
          java -Xmx4g -jar morphe.jar patch -p patches.mpp --force --exclusive \
            -e "Hide ads" \
            -e "Remove background playback restrictions" \
            -e "Downloads" \
            -e "GmsCore support" \
            -o youtube-patched.apk youtube.apk

      - name: Release me alag alag files upload
        run: |
          TAG="yt-patched-${{ github.run_number }}"
          gh release create "$TAG" youtube-patched.apk microg.apk all-patches.txt \
            --title "YouTube patched #${{ github.run_number }}" \
            --notes "microg.apk pehle install karo, phir youtube-patched.apk"
        env:
          GH_TOKEN: ${{ github.token }}
